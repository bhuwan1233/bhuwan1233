<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hand-Controlled 3D Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; font-size: 24px; pointer-events: none;
        }
        #video-container { display: none; } /* Hide the raw webcam feed */
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

<div id="loading">Initializing Camera & AI...</div>
<div id="video-container">
    <video class="input_video"></video>
</div>

<script>
    // --- CONFIGURATION ---
    const PARTICLE_COUNT = 4000;
    const SHAPE_CYCLE_DURATION = 8000; // ms

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- PARTICLE SYSTEM VARIABLES ---
    const particlesGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // Where particles want to go
    
    // Initialize random positions
    for(let i=0; i<PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 100;
        targetPositions[i] = positions[i];
        colors[i] = 1.0;
    }

    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Create a soft glow texture for particles
    const getTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 32);
        const texture = new THREE.Texture(canvas);
        texture.needsUpdate = true;
        return texture;
    };

    const material = new THREE.PointsMaterial({
        size: 0.8,
        vertexColors: true,
        map: getTexture(),
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true
    });

    const particleSystem = new THREE.Points(particlesGeometry, material);
    scene.add(particleSystem);

    // --- SHAPE GENERATORS ---
    // Helper to map sphere coordinates
    function getSpherePoint(i) {
        const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
        const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
        return {
            x: 10 * Math.cos(theta) * Math.sin(phi),
            y: 10 * Math.sin(theta) * Math.sin(phi),
            z: 10 * Math.cos(phi)
        };
    }

    // 1. Heart Shape
    function getHeartPoint(t) {
        // Parametric equations for a heart
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = 2; // flatten slightly
        return { x: x * 0.5, y: y * 0.5, z: (Math.random()-0.5)*5 };
    }

    // 2. Saturn (Ringed Planet)
    function getSaturnPoint(i) {
        if (i < PARTICLE_COUNT * 0.3) {
            // Planet Body
            return getSpherePoint(i * (1/0.3)); 
        } else {
            // Ring
            const angle = i * 0.1;
            const radius = 15 + Math.random() * 5;
            return {
                x: Math.cos(angle) * radius,
                y: (Math.random() - 0.5) * 1,
                z: Math.sin(angle) * radius
            };
        }
    }

    // 3. Flower/Helix
    function getFlowerPoint(i) {
        const angle = i * 0.05;
        const radius = Math.sqrt(i) * 0.3;
        return {
            x: Math.cos(angle) * radius,
            y: Math.sin(angle) * radius,
            z: Math.sin(i * 0.1) * 5
        };
    }

    // --- INTERACTION STATE ---
    let handX = 0; 
    let handY = 0;
    let pinchStrength = 0; // 0 to 1
    let isFist = false;
    let currentShapeIndex = 0;
    const shapeFunctions = [
        (i) => getSpherePoint(i),
        (i) => { const p = getHeartPoint(i * 0.1); return p; },
        (i) => getSaturnPoint(i),
        (i) => getFlowerPoint(i)
    ];

    // Cycle shapes automatically
    setInterval(() => {
        currentShapeIndex = (currentShapeIndex + 1) % shapeFunctions.length;
    }, SHAPE_CYCLE_DURATION);

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime();
        const positionsAttr = particlesGeometry.attributes.position;
        const colorsAttr = particlesGeometry.attributes.color;

        // --- DYNAMIC LOGIC ---
        // Calculate shape targets
        const getTarget = shapeFunctions[currentShapeIndex];

        // Hand influence center
        // Map handX/Y (-1 to 1) to 3D space approx (-15 to 15)
        const targetX = -handX * 20; 
        const targetY = -handY * 15;

        // Color Base based on Pinch
        const rBase = 0.5 + pinchStrength * 0.5;
        const gBase = 0.3;
        const bBase = 1.0 - pinchStrength;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const idx = i * 3;

            // 1. Get Base Shape Position
            let p = getTarget(i);

            // 2. Modify based on Hand Interaction
            // If Pinching: Expand shape (Explosion effect)
            const expansion = 1 + (pinchStrength * 3); 
            
            // If Fist: Add random jitter (Fireworks/Chaos)
            let jitterX = 0, jitterY = 0, jitterZ = 0;
            if (isFist) {
                jitterX = (Math.random() - 0.5) * 5;
                jitterY = (Math.random() - 0.5) * 5;
                jitterZ = (Math.random() - 0.5) * 5;
            }

            // Target coordinates in world space
            // We add targetX/Y to move the whole system with the hand
            let tx = (p.x * expansion) + targetX + jitterX;
            let ty = (p.y * expansion) + targetY + jitterY;
            let tz = (p.z * expansion) + jitterZ;

            // 3. Lerp (Smooth Transition)
            // Current pos moves 5% towards target per frame
            positions[idx] += (tx - positions[idx]) * 0.05;
            positions[idx+1] += (ty - positions[idx+1]) * 0.05;
            positions[idx+2] += (tz - positions[idx+2]) * 0.05;

            // 4. Rotation effect
            const originalX = positions[idx];
            const originalZ = positions[idx+2];
            const rotSpeed = 0.005 + (pinchStrength * 0.02);
            positions[idx] = originalX * Math.cos(rotSpeed) - originalZ * Math.sin(rotSpeed);
            positions[idx+2] = originalX * Math.sin(rotSpeed) + originalZ * Math.cos(rotSpeed);

            // 5. Update Colors
            // Mix base color with position-based variation
            colors[idx] = rBase + (positions[idx] / 30);
            colors[idx+1] = gBase + (positions[idx+1] / 30);
            colors[idx+2] = bBase + Math.sin(time + i);
        }

        positionsAttr.needsUpdate = true;
        colorsAttr.needsUpdate = true;

        renderer.render(scene, camera);
    }

    animate();

    // --- MEDIAPIPE HANDS SETUP ---
    const videoElement = document.getElementsByClassName('input_video')[0];

    function onResults(results) {
        document.getElementById('loading').style.display = 'none';

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];

            // 1. Track Hand Position (Index Finger Tip - Landmark 8)
            // MediaPipe Coords are 0.0 to 1.0. We map to -1.0 to 1.0 center.
            handX = (landmarks[8].x - 0.5) * 2;
            handY = (landmarks[8].y - 0.5) * 2;

            // 2. Track Pinch (Distance between Index Tip 8 and Thumb Tip 4)
            const dx = landmarks[8].x - landmarks[4].x;
            const dy = landmarks[8].y - landmarks[4].y;
            const distance = Math.sqrt(dx*dx + dy*dy);

            // Normalize pinch: 0.02 is close, 0.2 is far
            // Invert logic: Pinching (fingers touching) usually means "grab" or "small".
            // Let's make "Spread" fingers = Expand particles.
            // Distance varies roughly 0.0 to 0.3
            pinchStrength = Math.min(Math.max((distance - 0.05) * 4, 0), 1);

            // 3. Detect Fist (Tips of fingers below lower joints)
            // Simplified: If fingertips are close to palm base (landmark 0)
            const middleTipY = landmarks[12].y;
            const wristY = landmarks[0].y;
            isFist = (wristY - middleTipY) < 0.1; // Threshold
        }
    }

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 640,
        height: 480
    });

    cameraUtils.start();

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
