<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 2px 2px 4px #000; }
        canvas { display: block; }
        video { transform: scaleX(-1); position: absolute; width: 200px; height: auto; bottom: 20px; right: 20px; border: 2px solid #444; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Hand Flow 3D</h1>
        <p>Gesture: <span id="gesture-name">Waiting...</span></p>
        <p>Pinch to Contract | Open Palm to Expand | Move to Rotate</p>
    </div>
    
    <video id="input_video"></video>

    <!-- Load Three.js and MediaPipe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        /** 
         * CONFIG & GLOBALS 
         */
        const PARTICLE_COUNT = 5000;
        let scene, camera, renderer, particles, geometry, material;
        let targetPositions = [];
        let currentTemplate = 'sphere';
        const videoElement = document.getElementById('input_video');
        const gestureText = document.getElementById('gesture-name');

        /**
         * 3D SCENE SETUP
         */
        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Particles
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 10;
                colors[i] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({
                size: 0.05,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            createTemplate('sphere');
        }

        /**
         * PARTICLE TEMPLATES (Math Logic)
         */
        function createTemplate(type) {
            currentTemplate = type;
            const posAttr = geometry.attributes.position.array;
            targetPositions = [];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z;
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * 2 - 1;

                if (type === 'heart') {
                    const phi = Math.random() * Math.PI * 2;
                    x = 16 * Math.pow(Math.sin(phi), 3) / 10;
                    y = (13 * Math.cos(phi) - 5 * Math.cos(2 * phi) - 2 * Math.cos(3 * phi) - Math.cos(4 * phi)) / 10;
                    z = (Math.random() - 0.5) * 0.5;
                } 
                else if (type === 'flower') {
                    const k = 5;
                    const r = Math.cos(k * t) * 2;
                    x = r * Math.cos(t);
                    y = r * Math.sin(t);
                    z = (Math.random() - 0.5) * 0.5;
                }
                else if (type === 'saturn') {
                    if (i < PARTICLE_COUNT * 0.6) { // The Planet
                        const r = 1.5;
                        x = r * Math.sqrt(1 - u * u) * Math.cos(t);
                        y = r * Math.sqrt(1 - u * u) * Math.sin(t);
                        z = r * u;
                    } else { // The Ring
                        const r = 2.5 + Math.random() * 0.5;
                        x = r * Math.cos(t);
                        y = r * Math.sin(t) * 0.2; // Slanted ring
                        z = r * Math.sin(t);
                    }
                }
                else if (type === 'fireworks') {
                    const r = Math.random() * 4;
                    x = r * Math.sqrt(1 - u * u) * Math.cos(t);
                    y = r * Math.sqrt(1 - u * u) * Math.sin(t);
                    z = r * u;
                }
                else { // Default Sphere
                    const r = 2;
                    x = r * Math.sqrt(1 - u * u) * Math.cos(t);
                    y = r * Math.sqrt(1 - u * u) * Math.sin(t);
                    z = r * u;
                }
                targetPositions.push(x, y, z);
            }
        }

        /**
         * HAND TRACKING LOGIC
         */
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. Position mapping (Index finger tip)
                const indexTip = landmarks[8];
                particles.rotation.y = (indexTip.x - 0.5) * 4;
                particles.rotation.x = (indexTip.y - 0.5) * 4;

                // 2. Gesture Detection: Pinch (Thumb tip to Index tip distance)
                const thumbTip = landmarks[4];
                const distance = Math.sqrt(
                    Math.pow(indexTip.x - thumbTip.x, 2) + 
                    Math.pow(indexTip.y - thumbTip.y, 2)
                );

                // 3. Dynamic Expansion/Contraction
                const scale = THREE.MathUtils.lerp(0.2, 2.5, distance * 3);
                particles.scale.set(scale, scale, scale);

                // 4. Color Change based on Hand Height
                const hue = indexTip.y * 360;
                material.color.setHSL(indexTip.y, 0.8, 0.5);

                // 5. Template Switching based on Finger count
                // Simple logic: if pinky is up vs down
                const pinkyUp = landmarks[20].y < landmarks[18].y;
                const middleUp = landmarks[12].y < landmarks[10].y;

                if (distance < 0.05) {
                    gestureText.innerText = "Pinching (Contract)";
                } else if (pinkyUp && !middleUp) {
                    if (currentTemplate !== 'heart') createTemplate('heart');
                    gestureText.innerText = "Pinky Up (Heart)";
                } else if (pinkyUp && middleUp) {
                    if (currentTemplate !== 'saturn') createTemplate('saturn');
                    gestureText.innerText = "Full Hand (Saturn)";
                } else {
                    if (currentTemplate !== 'flower') createTemplate('flower');
                    gestureText.innerText = "Open Palm (Flower)";
                }
            }
        });

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        cameraFeed.start();

        /**
         * ANIMATION LOOP
         */
        function animate() {
            requestAnimationFrame(animate);

            // Smoothly morph particles to target positions
            const positions = geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i++) {
                positions[i] += (targetPositions[i] - positions[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;

            // Subtle rotation
            particles.rotation.z += 0.002;

            renderer.render(scene, camera);
        }

        // Handle Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initScene();
        animate();
    </script>
</body>
</html>
